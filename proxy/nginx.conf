worker_processes 1;

events { worker_connections 1024; }

http {
    sendfile on;
    include mime.types;
    default_type application/octet-stream;

    # §22 Request-size limit (10 MB max upload)
    client_max_body_size 10m;

    # §22 System Hardening — Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:* ws://localhost:*;" always;

    # Hide server version
    server_tokens off;

    server {
        listen 80;
        server_name localhost;

        # Frontend Route
        location /ai {
            proxy_pass http://foms-ai-frontend:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redirect root / to /ai
        location = / {
            return 301 http://$host/ai;
        }

        # API Gateway Route
        location /api/ai {
            proxy_pass http://foms-ai-gateway:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Allow large uploads for document checks, timeout configs
            proxy_read_timeout 90;
            proxy_connect_timeout 90;
            proxy_send_timeout 90;
            client_max_body_size 10m;
        }

        # Health endpoint
        location /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"healthy"}';
        }

        # Block access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
