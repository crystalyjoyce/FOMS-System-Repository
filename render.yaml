services:
  # -------------------------------------------------------
  # 1. FOMS .NET Backend (ASP.NET Core 9)
  # -------------------------------------------------------
  - type: web
    name: foms-backend
    runtime: docker
    dockerfilePath: ./foms-backend/Dockerfile
    dockerContext: ./foms-backend
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false   # Set this in Render dashboard: your Supabase PostgreSQL URL
      - key: JwtSettings__Secret
        value: FOMS_Capstone_JWT_SecureKey_2026!!
      - key: JwtSettings__Issuer
        value: FOMS.Api
      - key: JwtSettings__Audience
        value: FOMS.Api
      - key: AllowedCorsOrigins__0
        sync: false   # Set to your Vercel foms-frontend URL
      - key: AllowedCorsOrigins__1
        sync: false   # Set to your Vercel speedpay-portal URL
      - key: PayMongo__SecretKey
        value: sk_test_fyNzfY2nbwdhfgUcoMmWoZJq
      - key: PayMongo__WebhookSecret
        value: whsk_AhGd2fDaqcnLia9sJ79EHsL2
      - key: PayMongo__SuccessUrl
        sync: false   # Set to your Vercel foms-frontend URL + /client-portal?status=success
      - key: PayMongo__CancelUrl
        sync: false   # Set to your Vercel foms-frontend URL + /client-portal?status=cancelled
    healthCheckPath: /swagger/index.html

  # -------------------------------------------------------
  # 2. Python FastAPI AI Service
  # -------------------------------------------------------
  - type: web
    name: foms-ai-service
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    plan: free
    envVars:
      - key: POSTGRES_CONNECTION_STRING
        sync: false   # Set to your Supabase PostgreSQL URL (for ai-service DB)
      - key: MONGODB_URI
        sync: false   # Set to your MongoDB Atlas connection string
      - key: FOMS_READ_API_URL
        fromService:
          type: web
          name: foms-backend
          property: host
      - key: GEMINI_API_KEY
        value: AQ.Ab8RN6IMjC1jNG1OMO4A5E5GNNAOAAyO33uKEk-3yALyGbDfZw
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: FOMS_AI_SERVICE_API_KEY
        value: change-me
      - key: AI_SERVICE_API_KEY
        value: change-me
      - key: SYNC_INTERVAL_MINUTES
        value: "10"
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # Set to your Vercel ai-frontend URL
      - key: RATE_LIMIT_DEFAULT
        value: "30/minute"
      - key: RATE_LIMIT_UPLOAD
        value: "10/minute"
      - key: AUDIT_RETENTION_YEARS
        value: "5"
      - key: LOG_ROTATION_MAX_SIZE_MB
        value: "100"
      - key: LOG_ROTATION_DAILY
        value: "true"

  # -------------------------------------------------------
  # 3. ASP.NET Core AI Gateway
  # -------------------------------------------------------
  - type: web
    name: foms-ai-gateway
    runtime: docker
    dockerfilePath: ./ai-gateway/Dockerfile
    dockerContext: ./ai-gateway
    plan: free
    envVars:
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: foms-ai-service
          property: host
      - key: AI_SERVICE_API_KEY
        value: change-me
